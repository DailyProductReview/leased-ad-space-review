
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Erfolgsmaschine – Jetzt starten</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0c10;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 20px;
    }

    /* Hauptcontainer – zentriert und responsive */
    .landing-container {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 32px;
      box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.4), 0 2px 8px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    /* Interaktiver Bildbereich – klickbarer Cursor */
    .clickable-image {
      display: block;
      width: 100%;
      cursor: pointer;
      transition: opacity 0.2s ease, filter 0.2s ease;
      background: #f2f4f8;
      line-height: 0; /* verhindert ungewollten Abstand unter dem Bild */
    }

    .clickable-image img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      background: #ffffff;
    }

    /* Hover-Effekt: dezentes Aufhellen + leichter Schatten */
    .clickable-image:hover {
      filter: brightness(1.01) contrast(1.02);
    }

    .clickable-image:active {
      transform: scale(0.99);
      transition: transform 0.05s linear;
    }

    /* Subtiler Hinweis am unteren Bildrand (optional) */
    .hint-tooltip {
      background: #f9fafc;
      text-align: center;
      padding: 12px 16px;
      font-size: 0.85rem;
      color: #2c3e4e;
      border-top: 1px solid #e9edf2;
      letter-spacing: 0.3px;
      font-weight: 450;
    }

    .hint-tooltip span {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eef2f7;
      padding: 6px 14px;
      border-radius: 60px;
    }

    .hint-tooltip svg {
      width: 18px;
      height: 18px;
      fill: none;
      stroke: #1e6f9f;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Footer / kleine info – dezent */
    .footer-meta {
      background: #f5f7fa;
      padding: 12px 20px;
      font-size: 0.7rem;
      text-align: center;
      color: #6c7a8a;
      border-top: 1px solid #e2e8f0;
      font-family: monospace;
    }

    /* voll responsive: Randausgleich, falls Bild zu breit */
    @media (max-width: 720px) {
      .landing-container {
        border-radius: 24px;
      }
      .hint-tooltip {
        padding: 8px 12px;
        font-size: 0.75rem;
      }
      .hint-tooltip span {
        padding: 4px 10px;
      }
    }

    /* Fokussierbar für Barrierefreiheit (Tastatur) */
    .clickable-image:focus-visible {
      outline: 3px solid #1e6f9f;
      outline-offset: 2px;
      border-radius: 12px;
    }

    /* verhindert unschönes blaues Highlight auf Mobilgeräten */
    .clickable-image {
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>
<div class="landing-container">
  <!-- Das gesamte Bild ist klickbar – öffnet die Zielseite im neuen Tab -->
  <a href="https://hop.clickbank.net/?affiliate=verborgene&vendor=ambsador&cbpage=ambassador-trial"
     target="_blank"
     rel="noopener noreferrer"
     class="clickable-image"
     aria-label="Zum Ambassador-Programm – wird in einem neuen Tab geöffnet">
    <img src="https://imgallery.llsvr.com/sandyarta.6a0ad5a2812d9.png"
         alt="Erfolgsgrafik: I WENT FROM SO TO $104,170.53 A MONTH ON AUTOPILOT – Klicken für exklusiven Zugang"
         loading="eager"
         width="1200"
         height="auto">
  </a>

  <!-- Minimaler, optionaler Hinweis (Design bleibt clean, nur kleine Info) -->
  <div class="hint-tooltip">
    <span>
      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="1.8" fill="none">
        <path d="M18 13v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h3" />
        <polyline points="15 3 21 3 21 9" />
        <line x1="10" y1="14" x2="21" y2="3" />
      </svg>
    </span>
  </div>
  <div class="footer-meta">
  </div>
</div>

<!-- Optional: Ein kleiner Scriptblock für zusätzliche Sicherheit / Tracking-frei -->
<!-- Kein Tracking, reine Landingpage gemäß Anforderung: Bild & Klick öffnet Zielseite im neuen Fenster -->
</body>
</html>
